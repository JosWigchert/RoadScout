name: roadscout-api
services:
  routing-api:
    build: ../backend
    restart: unless-stopped
    environment:
      LISTEN_ADDR: :8080
      ROUTING_PROVIDER: valhalla
      ENABLE_EXPERIMENTAL_ROUTING: ${ENABLE_EXPERIMENTAL_ROUTING:-0}
      VALHALLA_BASE_URL: ${VALHALLA_BASE_URL:-http://Valhalla:8002}
      CAMERA_DATA_DIR: /data/cameras
      TRAFFIC_CONFIG: /etc/roadscout/traffic.json
    volumes:
      - ${CAMERA_DATA_HOST_DIR:-../backend/data/cameras}:/data/cameras:rw
      - ${TRAFFIC_CONFIG_HOST_FILE:-./traffic.config.example.json}:/etc/roadscout/traffic.json:ro
    ports:
      - "8080:8080"
    networks:
      - valhalla
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
networks:
  valhalla:
    external: true
    name: ${VALHALLA_NETWORK:?Set the existing Valhalla Docker network name}
