name: roadscout
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    restart: unless-stopped
    environment:
      tile_urls: ${OSM_URL:-https://download.geofabrik.de/europe/netherlands/utrecht-261020.osm.pbf}
      server_threads: "2"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      build_transit: "False"
      build_tar: "True"
      use_default_speeds_config: "False"
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
    volumes:
      - ./valhalla/data:/custom_files
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15m
    networks:
      - routing
  local-tls:
    image: nginx:1.28.0-alpine
    profiles: [local]
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./local/certs:/etc/nginx/certs:ro
    depends_on:
      - valhalla
    networks:
      - routing
networks:
  routing:
